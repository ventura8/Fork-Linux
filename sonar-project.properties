# SonarQube Cloud analysis for Fork for Linux (unofficial).
#
# Scanned by scripts/ci-sonar.sh (local, Docker scanner) and by the SonarQube Cloud
# step inside the `coverage` job of .github/workflows/check.yml (same Cobertura XML).
# This file must stay at the repository root: the scanner only looks there
# (allowed root exception, AGENTS.md §4.7.1).
#
# Exclusions are scoped by path. Rule-level ignores (sonar.issue.ignore.multicriteria)
# must name one rule AND one path and carry a comment with the reason; NOSONAR comments
# in code are forbidden (AGENTS.md §4.5, enforced by scripts/no-suppressions-lint.py).

sonar.organization=ventura8
sonar.projectKey=ventura8_Fork-Linux
sonar.projectName=Fork for Linux (unofficial)
sonar.host.url=https://sonarcloud.io
# sonar.projectVersion is passed by scripts/ci-sonar.sh from VERSION (single source of truth).

sonar.sourceEncoding=UTF-8
sonar.sources=src/fork_linux,libexec,bin,bridge/common,bridge/unix,bridge/win,scripts
sonar.tests=tests,bridge/tests
sonar.test.inclusions=tests/**,bridge/tests/**

# Python: Cobertura XML written by the coverage stage (pytest --cov-report=xml).
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14
sonar.python.coverage.reportPaths=artifacts/coverage/coverage.xml

# C bridge: analysed without a compile database (the scanner container has no compiler,
# and the PE shims only build with MinGW), same as Ubuntu-Hello. C coverage comes from
# the native unit + daemon tests via gcovr (artifacts/coverage/c-coverage.xml, generic
# SonarQube format), written by scripts/ci-sonar.sh / the coverage stage.
sonar.coverageReportPaths=artifacts/coverage/c-coverage.xml

sonar.exclusions=\
  **/build-*/**,\
  **/builddir*/**,\
  **/artifacts/**,\
  **/.cache/**,\
  **/.claude/**,\
  **/logs/**,\
  bridge/spike/**,\
  scripts/spike/**,\
  scripts/qa/**,\
  docs/**
sonar.coverage.exclusions=\
  tests/**,\
  bridge/tests/**,\
  scripts/**,\
  bin/**,\
  libexec/**
