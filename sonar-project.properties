# SonarQube Cloud analysis for Fork for Linux (unofficial).
#
# Scanned by scripts/ci-sonar.sh (local, Docker scanner) and by the SonarQube Cloud
# step inside the `coverage` job of .github/workflows/check.yml (same Cobertura XML).
# This file must stay at the repository root: the scanner only looks there
# (allowed root exception, AGENTS.md §4.7.1).
#
# Exclusions are scoped by path. Rule-level ignores (sonar.issue.ignore.multicriteria)
# must name one rule AND one path and carry a comment with the reason; NOSONAR comments
# in code are forbidden (AGENTS.md §4.5, enforced by scripts/no-suppressions-lint.py).

sonar.organization=ventura8
sonar.projectKey=ventura8_Fork-Linux
sonar.projectName=Fork for Linux (unofficial)
sonar.host.url=https://sonarcloud.io
# sonar.projectVersion is passed by scripts/ci-sonar.sh from VERSION (single source of truth).

sonar.sourceEncoding=UTF-8
sonar.sources=src/fork_linux,libexec,bin,bridge/common,bridge/unix,bridge/win,scripts
# bridge/win/tests/ (fl-testdrv.c, the Wine tier's test driver) is test code that lives
# beside the shims it drives: it is excluded from the sources below and analysed as a test.
sonar.tests=tests,bridge/tests,bridge/win/tests
sonar.test.inclusions=tests/**,bridge/tests/**,bridge/win/tests/**

# Python: Cobertura XML written by the coverage stage (pytest --cov-report=xml).
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14
sonar.python.coverage.reportPaths=artifacts/coverage/coverage.xml

# C bridge: analysed without a compile database (the scanner container has no compiler,
# and the PE shims only build with MinGW), same as Ubuntu-Hello. C coverage
# (artifacts/coverage/c-coverage.xml, generic SonarQube format, repo-relative paths) is
# written by scripts/ci-c-coverage.sh (FL_SONAR_COVERAGE=1 ./scripts/ci-sonar.sh): gcov
# of a -Db_coverage=true build, from the native unit tests, the daemon protocol tests
# and the Wine tier (MinGW --coverage shims under Wine), merged by scripts/gcov-sonar.py.
sonar.coverageReportPaths=artifacts/coverage/c-coverage.xml

sonar.exclusions=\
  **/build-*/**,\
  **/builddir*/**,\
  **/artifacts/**,\
  **/.cache/**,\
  **/.claude/**,\
  **/logs/**,\
  bridge/spike/**,\
  bridge/win/tests/**,\
  scripts/spike/**,\
  scripts/qa/**,\
  docs/**
# scripts/check-coverage.py reads sonar.sources and both exclusion lists from this file
# (every file >= 90%, enforced before the scan), so its scope always equals Sonar's.
sonar.coverage.exclusions=\
  tests/**,\
  bridge/tests/**,\
  scripts/**,\
  bin/**,\
  libexec/**

# Rule ignores (one rule + one path each; reason in the comment). Sonar's Python taint
# engine does not treat os.path.commonpath / realpath guards as sanitizers for S2083 /
# S8707, and does not see that gen-scenarios-doc's git refs are an allowlist (S6350).
# These scripts are maintainer/CI tools, not user-facing download or install paths.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
# S2083: path traversal — scripts already refuse paths outside the repo / data root.
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e1.resourceKey=**/scripts/gen-scenarios-doc.py
sonar.issue.ignore.multicriteria.e2.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e2.resourceKey=**/scripts/packaging-e2e-state.py
# S8707: CLI path arguments — packaging-e2e-state and e2e-plan only run in CI with fixed paths.
sonar.issue.ignore.multicriteria.e3.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e3.resourceKey=**/scripts/packaging-e2e-state.py
sonar.issue.ignore.multicriteria.e4.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e4.resourceKey=**/scripts/e2e-plan.py
# S6350: git argv — refs come from the PROVIDERS allowlist; argv is a list, never a shell.
sonar.issue.ignore.multicriteria.e5.ruleKey=pythonsecurity:S6350
sonar.issue.ignore.multicriteria.e5.resourceKey=**/scripts/gen-scenarios-doc.py

