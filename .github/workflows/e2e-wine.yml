---
name: E2E (real Fork under Wine)

# The real tier: managed Wine + .NET + the official Fork installer under Xvfb (about 20
# minutes, ~2.5 GB of downloads made on the runner). Weekly, on demand, and on same-repo PRs
# from release branches (feature/vX.Y.Z). Uploads logs only: no screenshots (they show Fork's
# logo), no binaries, and the Fork installer is never cached (AGENTS.md hard rules 1, 4).
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-wine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'feature/v'))
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Real setup + Fork window + doctor + snapshot/rollback (Xvfb)
        run: ./scripts/ci-e2e-wine.sh

      - name: Keep the logs (text only)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-wine-logs
          path: logs/e2e-wine/
          if-no-files-found: ignore
          retention-days: 14
