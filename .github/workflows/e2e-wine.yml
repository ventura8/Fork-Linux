---
name: E2E (real Fork under Wine)

# The real tier: managed Wine + .NET + the official Fork installer under Xvfb, every scenario of
# docs/qa/E2E-SCENARIOS.md in a few parallel shards. Each shard sets the main prefix up once (a
# template root, built in the job and deleted with it) and runs its modules two at a time, longest
# first, each in a container and a root of its own copied from that template (modules that set up
# prefixes of their own start from its download caches): scripts/ci-e2e-wine.sh. Among them the
# Fork-update tier (Fork 2.23.1 updating itself and through fork-linux) and the app-upgrade tier
# (a step revision, an upgrade while Fork runs, a Wine pin change and back, uninstall / reinstall,
# the bridge replaced under a running daemon, our upgrade plus Fork's own); and the same setup under
# each desktop of the desktop E2E tier (docs/qa/DE-E2E.md: Fork under the desktop's window manager,
# its terminal, file manager and "Open in Fork"). Weekly, on demand, and on same-repo PRs from
# release branches (feature/vX.Y.Z). Every job downloads fresh (no seed, nothing kept between
# runs). Uploads logs only: no screenshots (they show Fork's logo), no binaries, and the Fork
# installer is never cached (AGENTS.md hard rules 1, 4).
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-wine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'feature/v'))
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    # A few shards of tests/e2e, balanced on tests/e2e/timings.json (tests/test_e2e_plan.py estimates
    # each and keeps it well under the hour; every module is in exactly one shard,
    # tests/test_workflows.py). A runner (4 cores, 16 GB) runs two real-Fork containers at once.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: setup-and-fork-update
            jobs: 2
            tests: >-
              tests/e2e/test_fork_update.py tests/e2e/test_real_setup_variants.py
          - shard: integration
            jobs: 2
            tests: >-
              tests/e2e/test_real_integration.py
          - shard: git
            jobs: 2
            tests: >-
              tests/e2e/test_real_git_remotes.py tests/e2e/test_real_git_history.py
              tests/e2e/test_real_fork.py tests/e2e/test_real_git_changes.py
              tests/e2e/test_real_git_advanced.py tests/e2e/test_real_snapshots.py
          - shard: app-upgrade-bridge-launch
            jobs: 2
            tests: >-
              tests/e2e/test_wine_app_upgrade.py tests/e2e/test_real_bridge.py
              tests/e2e/test_real_launch.py tests/e2e/test_real_display.py
              tests/e2e/test_real_doctor.py tests/e2e/test_real_uninstall.py
              tests/e2e/test_real_setup_errors.py
          - shard: remotes-and-guards
            jobs: 2
            tests: >-
              tests/e2e/test_git_ops_remote_bridge.py tests/e2e/test_real_git_branches.py
              tests/e2e/test_wine_pin_upgrade.py tests/e2e/test_git_ops_remote_ssh.py
              tests/e2e/test_git_ops_local.py tests/e2e/test_real_update_guards.py
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build the native-git bridge (the bridge scenarios need its shims)
        run: ./scripts/build-bridge.sh

      - name: Real Fork under Wine, shard ${{ matrix.shard }} (Xvfb)
        env:
          TESTS: ${{ matrix.tests }}
          JOBS: ${{ matrix.jobs }}
        run: |
          read -r -a tests <<<"${TESTS}"
          ./scripts/ci-e2e-wine.sh --jobs "${JOBS}" "${tests[@]}"

      - name: Keep the logs (text only)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-wine-logs-${{ matrix.shard }}
          path: logs/e2e-wine/
          if-no-files-found: ignore
          retention-days: 14

  e2e-de:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'feature/v'))
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        desktop: [xfce, gnome, kde, kdewayland, cinnamon, mate, budgie, lxqt]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Real setup + Fork under ${{ matrix.desktop }} (fresh downloads)
        run: ./scripts/ci-e2e-de.sh "${{ matrix.desktop }}" --fork

      - name: Keep the logs (text only)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-de-${{ matrix.desktop }}-fork-logs
          path: logs/e2e-de/
          if-no-files-found: ignore
          retention-days: 14
