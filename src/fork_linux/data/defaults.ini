# Fork for Linux (unofficial) settings: ~/.config/fork-linux/config.ini
#
# Every setting is listed below, commented out, at its default value.
# Uncomment a line to change it, or run: fork-linux config set SECTION.KEY VALUE
# Environment variables FORK_LINUX_<SECTION>_<KEY> (e.g. FORK_LINUX_WINE_DEBUG)
# override this file. 'fork-linux config list' shows the values in effect.

[wine]
# Which Wine runs Fork: managed (a pinned, sha256-verified Wine build downloaded for
# you), system (your distribution's wine, 9.0 or newer), flatpak (Flatpak builds only)
# or an absolute path to a wine binary.
# provider = managed

# Managed Wine build id from the runtime manifest; empty means the tested default.
# build =

# WINEDEBUG channels while Fork runs (-all keeps Wine quiet).
# debug = -all

# Graphics driver: auto (X11 or XWayland), x11, or wayland (Wine's experimental Wayland
# driver).
# driver = auto

# Direct3D renderer used by Fork's WPF interface: gdi (most reliable), gl or vulkan.
# renderer = gdi

# Extra WINEDLLOVERRIDES entries for Fork, e.g. dwrite=n,b;d3d9=b (empty: none).
# extra_dll_overrides =

[fork]
# Fork version that setup installs: known-good (tested with this fork-linux release) or
# latest (newest from Fork's release feed, verified after install).
# channel = known-good

# Fork's own updater: auto (allowed; a snapshot is taken before each launch) or pinned
# (stay on the installed version; set by 'fork-linux rollback').
# update_policy = auto

# Fork settings kept at Wine-safe values before every launch (comma separated; empty:
# none).
# enforce_settings = UpdateSubmodulesOnCheckout, DisableHardwareAcceleration

[display]
# Fork's DPI: auto (from your desktop's scaling) or a number such as 96, 120, 144 or
# 192.
# dpi = auto

# Light or dark Windows theme: follow (your desktop's preference), light or dark.
# theme = follow

[ssh]
# Share ~/.ssh keys and config with Fork's bundled ssh: auto (when ~/.ssh exists), on or
# off.
# sync = auto

# How private keys are shared: link (symbolic links) or copy (private 0600 copies).
# mode = link

# Experimental: let Fork's ssh use your ssh-agent ($SSH_AUTH_SOCK).
# agent_bridge = off

[git]
# Give Fork's bundled git a translated copy of ~/.gitconfig: translate or off.
# config_overlay = translate

# git settings passed to Fork's git through GIT_CONFIG_COUNT (comma separated
# key=value).
# env_overrides = core.filemode=false, core.autocrlf=false

# Trust every repository (safe.directory=*) to silence 'dubious ownership' errors.
# safe_directory_all = false

# Experimental native-git bridge; manage it with 'fork-linux git-bridge enable|disable'.
# bridge = off

[integration]
# Terminal for Fork's 'Open in Terminal': auto or a command such as gnome-terminal or
# konsole.
# terminal = auto

# Open files and folders from Fork with your Linux applications instead of Wine's.
# open_files_natively = true

[snapshots]
# Snapshots of Fork's install directory kept for rollback (0 disables snapshots).
# keep = 2

# How snapshots are made: auto (hard links when possible), hardlink or copy.
# method = auto

[ui]
# How setup shows progress: auto (a dialog on a desktop, else the terminal), zenity,
# kdialog or terminal.
# progress = auto
