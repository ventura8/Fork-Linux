# Tool configuration only. Fork for Linux (unofficial) is not a pip package:
# no [build-system], no [project] (Meson installs it; VERSION is the version).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src/fork_linux"]

[tool.coverage.report]
show_missing = true

# ruff (pinned in docker/Dockerfile.ci.lint), run by the lint stage. Python 3.10 target.
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "build-*", "builddir*", "obj-*", "artifacts", "logs", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
